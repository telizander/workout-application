<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0C0B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Iron Log</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M0 0h26l6 6v26H6l-6-6z' fill='%23121614'/%3E%3Cpath d='M9 9h14v4H9zM9 15h14v4H9zM9 21h9v4H9z' fill='%2343E07F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Big+Shoulders+Display:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<main id="app">
  <section id="view-home" class="view" aria-label="Today"></section>
  <section id="view-log" class="view" aria-label="Log" hidden></section>
  <section id="view-session" class="view" aria-label="Session" hidden></section>
  <section id="view-summary" class="view" aria-label="Session summary" hidden></section>
</main>

<nav id="tabbar" aria-label="Sections">
  <button type="button" class="tab" data-act="tab" data-view="home" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v4H4zM4 11h16v4H4zM4 17h10v4H4z"/></svg>
    <span>Today</span>
  </button>
  <button type="button" class="tab" data-act="tab" data-view="log">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v15H5zM8 9h8v1.6H8zM8 13h8v1.6H8zM8 17h5v1.6H8z"/></svg>
    <span>Log</span>
  </button>
  <i class="tab-ind" aria-hidden="true"></i>
</nav>

<!-- Rest between rounds. Slides over the session. -->
<div id="rest-sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Rest" hidden></div>

<!-- Block-to-block transition plates. -->
<div id="shutter" aria-hidden="true"><i></i><i></i></div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="sound.js"></script>
<script src="app.js"></script>
</body>
</html>
